name: Collect rainfall data

on:
  schedule:
    - cron: "17 1,7,13,19 * * *"  # every 6 hours (times are UTC): about 6 am, noon, 6 pm, midnight Pacific
  workflow_dispatch:       # adds a "Run workflow" button on GitHub

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest
      - name: Run collector
        run: python collect.py
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Update rainfall data"
            git pull --rebase
            git push
          fi

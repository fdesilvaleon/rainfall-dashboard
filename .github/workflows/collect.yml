name: Collect rainfall data

on:
  schedule:
    - cron: "17 * * * *"  # every hour, at 17 minutes past
  workflow_dispatch:       # adds a "Run workflow" button on GitHub

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest
      - name: Run collector
        run: python collect.py
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Update rainfall data"
            # Push, trying up to 3 times (waiting 30 s, then 90 s). Each attempt first pulls
            # and replays our commit on top of any newer changes so they don't block the push.
            for wait in 0 30 90; do
              if [ "$wait" -gt 0 ]; then
                echo "Push failed. Trying again in $wait seconds."
                sleep "$wait"
              fi
              if git pull --rebase && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true  # clean up if the pull stopped halfway
            done
            echo "Push failed after 3 attempts."
            exit 1
          fi
